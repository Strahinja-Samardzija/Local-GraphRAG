services:
   neo4j:
      image: neo4j:5.15.0
      container_name: neo4j
      ports:
         - '7474:7474' # HTTP
         - '7687:7687' # Bolt
      environment:
         - NEO4J_AUTH=neo4j/your_password
         - NEO4J_PLUGINS=["apoc"]
         - NEO4J_dbms_memory_heap_initial__size=512m
         - NEO4J_dbms_memory_heap_max__size=1G
      volumes:
         - neo4j_data:/data
         - neo4j_logs:/logs
      restart: unless-stopped

volumes:
   neo4j_data:
   neo4j_logs:
